# ERP TOURECHE على VPS: حاوية واحدة على نفس شبكة Traefik الموجودة مع n8n، بدومين فرعي و HTTPS تلقائي.
# القيم (الدومين، الشبكة، entrypoints، certresolver) يكتبها install-vps.sh في deploy/.env بعد قراءتها من حاوية n8n.
name: erp-toureche

services:
  erp:
    build:
      context: ..
      dockerfile: Dockerfile
      # النسخة التي تُبنى (يكتبها erp.sh update) لتظهر في الإعدادات ← النظام
      args:
        ERP_COMMIT: ${ERP_COMMIT:-}
        ERP_COMMIT_DATE: ${ERP_COMMIT_DATE:-}
        ERP_COMMIT_SUBJECT: ${ERP_COMMIT_SUBJECT:-}
        ERP_BUILT_AT: ${ERP_BUILT_AT:-}
    image: erp-toureche:latest
    container_name: erp-toureche
    restart: unless-stopped
    environment:
      ERP_ALLOWED_ORIGINS: https://${ERP_DOMAIN}
      ERP_BACKUP_MIRROR: ${ERP_BACKUP_MIRROR:-}
    volumes:
      - erp_data:/data
      - ${ERP_OFFSITE_DIR:-./offsite}:/offsite
      # زر «تحديث الآن»: الحاوية تكتب الطلب في inbox، وخدمة erp-updater على الخادم تكتب النتيجة في state (قراءة فقط هنا)
      - ${ERP_UPDATER_DIR:-/var/lib/erp-updater}/inbox:/updater/inbox
      - ${ERP_UPDATER_DIR:-/var/lib/erp-updater}/state:/updater/state:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.erptoureche.rule=Host(`${ERP_DOMAIN}`)
      - traefik.http.routers.erptoureche.entrypoints=${TRAEFIK_ENTRY_HTTP:-web}
      - traefik.http.routers.erptoureche.middlewares=erptoureche-https
      - traefik.http.middlewares.erptoureche-https.redirectscheme.scheme=https
      - traefik.http.middlewares.erptoureche-https.redirectscheme.permanent=true
      - traefik.http.routers.erptoureche-secure.rule=Host(`${ERP_DOMAIN}`)
      - traefik.http.routers.erptoureche-secure.entrypoints=${TRAEFIK_ENTRY_HTTPS:-websecure}
      - traefik.http.routers.erptoureche-secure.tls=true
      - traefik.http.routers.erptoureche-secure.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.erptoureche.loadbalancer.server.port=3600

volumes:
  erp_data:

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK}
